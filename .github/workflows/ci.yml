name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: musi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musi_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall in packages/server runs `prisma generate` automatically.

      # `bun audit` (network) plus the fast-uri override watchdog, which fails
      # if the transitive fast-uri 3.1.2 pin has become a silent version-freeze.
      # See docs/agent_notes/backlog/fast-uri-override-removal.md.
      - name: Audit dependencies
        run: bun run audit:deps

      - name: Install system lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint

      - name: Configure gate heap
        run: |
          . scripts/lib/gate-env.sh
          printf 'NODE_OPTIONS=%s\n' "$NODE_OPTIONS" >> "$GITHUB_ENV"

      # The core gate consumes scripts/verify/steps.generated.sh, generated from
      # harness.controls.json. CI-only report-script invocations, docs, and
      # artifact steps stay hand-written around that generated core.
      #
      # HARNESS_CI_GATE binds this step to its harness.controls.json control id;
      # `bun run harness:check` parses this workflow and requires the step's
      # `run` to equal that control's manifest invocation. Keep it in step env,
      # not a comment: the check reads workflow data, not workflow prose.
      - name: Verify generated gate manifest
        id: verify
        env:
          HARNESS_CI_GATE: verify-wrapper/verify
          FORCE_VERIFY: "1"
          MUSI_VERIFY_LOG_DIR: .musi-ci-verify-logs
        run: bun run verify

      - name: Lint ratchet step summary
        if: always()
        env:
          LINT_RATCHET_ARTIFACT_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: bash scripts/ci/lint-ratchet-summary.sh

      - name: Sticky PR comment for lint-ratchet report
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINT_RATCHET_COMMENT_MARKER: "<!-- lint-ratchet-summary -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! bash scripts/ci/sticky-pr-comment.sh; then
            echo "::warning::failed to post sticky PR comment"
            exit 0
          fi

      - name: Upload lint-ratchet diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-ratchet-diagnostics
          path: .musi-ci-verify-logs/ratchet-diagnostics.json
          retention-days: 7

      # The failure summary prints only a 30-line filtered excerpt per failed
      # slot and points at a log path on the ephemeral runner; without this
      # upload the full failing output is unrecoverable. Full slot logs are
      # retained only when the verify gate itself failed.
      - name: Upload verify slot logs
        if: always() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-slot-logs
          path: .musi-ci-verify-logs
          retention-days: 7
          if-no-files-found: ignore

      # Per-slot timing data is small and worth sampling from every run
      # (success or failure) for latency measurement.
      - name: Upload verify timing data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-timings
          path: |
            .musi-ci-verify-logs/meta/*.json
            .musi-ci-verify-logs/test-timings.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Check harness manifest parity with rules and scripts
        run: bun run harness:check

      - name: Check module index
        run: bun run module:index:check

      - name: Build
        run: bun run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: musi_test_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musi_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musi_test_e2e
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
      CI: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall in packages/server runs `prisma generate` automatically.

      - name: Install Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
