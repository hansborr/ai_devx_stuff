name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: musi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musi_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall in packages/server runs `prisma generate` automatically.

      # `bun audit` (network) plus the fast-uri override watchdog, which fails
      # if the transitive fast-uri 3.1.2 pin has become a silent version-freeze.
      # See docs/agent_notes/backlog/fast-uri-override-removal.md.
      - name: Audit dependencies
        run: bun run audit:deps

      - name: Install system lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint

      - name: Configure gate heap
        run: |
          . scripts/lib/gate-env.sh
          printf 'NODE_OPTIONS=%s\n' "$NODE_OPTIONS" >> "$GITHUB_ENV"

      # The core gate consumes scripts/verify/steps.generated.sh, generated from
      # harness.controls.json. CI-only report, docs, and artifact steps stay
      # hand-written around that generated core.
      - name: Verify generated gate manifest
        env:
          FORCE_VERIFY: "1"
          MUSI_VERIFY_LOG_DIR: .musi-ci-verify-logs
        run: bun run verify

      - name: Lint ratchet step summary
        if: always()
        run: |
          diagnostics=".musi-ci-verify-logs/ratchet-diagnostics.json"
          report_path="lint-ratchet-report.md"
          artifact_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

          if [ ! -s "$diagnostics" ]; then
            {
              echo "<!-- lint-ratchet-summary -->"
              echo "### Lint ratchet"
              echo
              echo "Lint ratchet diagnostics envelope was not produced; the runner may have failed before emitting it."
              echo
              echo "Artifact: $artifact_url"
              echo "Recovery: see the failed run/artifact above; runner/formatter failure, not a baseline movement."
            } > "$report_path"
          else
            report_stdout="$(mktemp)"
            report_stderr="$(mktemp)"
            if LINT_RATCHET_REPORT_ARTIFACT_URL="$artifact_url" \
              bun run lint:ratchet:report < "$diagnostics" > "$report_stdout" 2> "$report_stderr"; then
              mv "$report_stdout" "$report_path"
            else
              {
                echo "<!-- lint-ratchet-summary -->"
                echo "### Lint ratchet"
                echo
                echo "Lint ratchet diagnostics envelope was produced, but the report formatter failed."
                echo
                echo "Formatter output:"
                echo '```'
                cat "$report_stdout"
                cat "$report_stderr"
                echo '```'
                echo
                echo "Artifact: $artifact_url"
                echo "Recovery: see the failed run/artifact above; runner/formatter failure, not a baseline movement."
              } > "$report_path"
            fi
            rm -f "$report_stdout" "$report_stderr"
          fi

          cat "$report_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment for lint-ratchet report
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ github.event.pull_request.number }}"
          marker="<!-- lint-ratchet-summary -->"

          post_comment() {
            if ! comment_id="$(
              gh api --paginate "repos/${{ github.repository }}/issues/$pr_number/comments" \
                --jq "first(.[] | select(.body | contains(\"$marker\")) | .id) // \"\""
            )"; then
              return 1
            fi

            if [ -n "$comment_id" ]; then
              # gh --field body=@file reads the file contents into the request field.
              gh api "repos/${{ github.repository }}/issues/comments/$comment_id" \
                --method PATCH \
                --field body=@lint-ratchet-report.md >/dev/null
            else
              gh pr comment "$pr_number" --body-file lint-ratchet-report.md >/dev/null
            fi
          }

          if ! post_comment; then
            echo "::warning::failed to post sticky PR comment"
            exit 0
          fi

      - name: Upload lint-ratchet diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-ratchet-diagnostics
          path: .musi-ci-verify-logs/ratchet-diagnostics.json
          retention-days: 7

      - name: Check harness manifest parity with rules and scripts
        run: bun run harness:check

      - name: Check module index
        run: bun run module:index:check

      - name: Build
        run: bun run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: musi_test_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musi_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musi_test_e2e
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
      CI: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall in packages/server runs `prisma generate` automatically.

      - name: Install Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
