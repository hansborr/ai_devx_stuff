name: Lint Ratchet Demo

# Non-default tier: a fresh `bun install` is network/cache-dependent, so this
# runs only when the demo or the @musi/lint-ratchet engine it consumes changes
# (plus on manual dispatch) — never in the per-commit changed-gate.
on:
  push:
    paths:
      - ".github/workflows/lint-ratchet-demo.yml"
      - "examples/lint-ratchet-demo/**"
      - "tools/lint-ratchet/**"
  pull_request:
    paths:
      - ".github/workflows/lint-ratchet-demo.yml"
      - "examples/lint-ratchet-demo/**"
      - "tools/lint-ratchet/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-smoke:
    name: Fresh-install clone-and-run smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # The demo-consumer smoke copies tools/lint-ratchet + the demo into a
      # throwaway Bun workspace off this checkout, installs, and walks the
      # adoption path with the merge driver — proving the package is copyable
      # without the deleted copy-sync manifest.
      - name: Fresh-install demo-consumer smoke
        run: bash examples/lint-ratchet-demo/smoke.sh
