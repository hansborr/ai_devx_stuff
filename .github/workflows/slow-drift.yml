name: Slow Drift Audit

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  slow-drift:
    name: Fused slow-drift report
    runs-on: ubuntu-latest
    # Budget: 30 min covered the base producers, and the opt-in scoped
    # mutation step adds a Stryker run (~6 min locally, slower on hosted
    # runners) self-bounded by MUSI_SLOW_DRIFT_MUTATION_TIMEOUT_SECS=1800
    # (30 min worst case). 30 + 30 = 60 would leave zero headroom, so a
    # worst-case mutation overrun would take fusion, the step summary, and
    # the always() artifact uploads down with the job — losing the
    # report-only artifacts this lane exists to produce. 75 keeps >=15 min
    # of post-mutation headroom; mutation failure or timeout still never
    # fails the lane (report-only note, lane continues).
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall in packages/server runs `prisma generate` automatically.

      - name: Run slow-drift audit
        run: bash scripts/slow-drift-audit.sh
        env:
          # Weekly opt-in: scoped shared-rules mutation + survivor summary,
          # report-only (thresholds.break stays null; failures leave a note
          # and the lane continues).
          MUSI_SLOW_DRIFT_MUTATION: "1"

      - name: Slow-drift step summary
        if: always()
        run: bash scripts/ci/slow-drift-summary.sh

      - name: Upload producer envelopes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-producer-envelopes
          path: reports/slow-drift/envelopes/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fused reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-fused-reports
          path: reports/slow-drift/fused/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload producer output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-producer-output
          path: reports/slow-drift/producers/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint message eval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-lint-message-eval
          path: reports/slow-drift/message-eval/*
          if-no-files-found: warn
          retention-days: 14
