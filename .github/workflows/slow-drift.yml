name: Slow Drift Audit

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  slow-drift:
    name: Fused slow-drift report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # postinstall in packages/server runs `prisma generate` automatically.

      - name: Run slow-drift audit
        run: bash scripts/slow-drift-audit.sh

      - name: Slow-drift step summary
        if: always()
        run: |
          report="reports/slow-drift/fused/harness-audit.txt"
          if [ -s "$report" ]; then
            {
              echo "### Slow drift audit"
              echo
              cat "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Slow drift audit"
              echo
              echo "No fused report was produced. Check the producer-output artifact for tool or setup errors."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload producer envelopes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-producer-envelopes
          path: reports/slow-drift/envelopes/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fused reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-fused-reports
          path: reports/slow-drift/fused/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload producer output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slow-drift-producer-output
          path: reports/slow-drift/producers/*
          if-no-files-found: warn
          retention-days: 14
