name: ${PROJECT_NAME}

# Parent the compose pod into devcontainers.slice so the collective memory
# caps (devcontainers.slice in the devcontainer-base repo, installed by
# devcontainer-rebuild.sh) cover app + db. Overriding pod_args replaces
# podman-compose's defaults wholesale, so --infra=false/--share= repeat them.
x-podman:
  pod_args: ["--infra=false", "--share=", "--cgroup-parent=devcontainers.slice"]

services:
  app:
    container_name: ${PROJECT_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:z
      - claude-config:/home/node/.claude:U
      - codex-config:/home/node/.codex:U
      - copilot-config:/home/node/.copilot:U
      - cursor-config:/home/node/.cursor:U
      - cursor-auth:/home/node/.config/cursor:U
      - shell-history:/commandhistory:U
      - persist:/home/node/persist:U
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro,z
      # Disk-backed (host /tmp is a small tmpfs); systemd-tmpfiles ages /var/tmp
      # after 30 days idle, so scratch still gets garbage-collected.
      - /var/tmp/devcontainer-${PROJECT_NAME}:/tmp:z
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8003:8003"
    init: true
    userns_mode: "keep-id"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file: .env
    command: /usr/local/bin/container-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    container_name: ${PROJECT_NAME}_db
    image: postgres:17
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:8002:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: ${PROJECT_NAME}_redis
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  claude-config:
  codex-config:
  copilot-config:
  cursor-config:
  cursor-auth:
  shell-history:
  persist:
    external: true
