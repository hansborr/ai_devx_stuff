name: ${PROJECT_NAME}

services:
  app:
    container_name: ${PROJECT_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:z
      - claude-config:/home/node/.claude:U
      - shell-history:/commandhistory:U
      - playwright-cache:/home/node/.cache/ms-playwright:U
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro,z
      - /tmp/${PROJECT_NAME}:/tmp:z
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8003:8003"
    init: true
    userns_mode: "keep-id"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file: .env
    command: /usr/local/bin/container-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    container_name: ${PROJECT_NAME}_db
    image: postgres:17
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "8002:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: ${PROJECT_NAME}_redis
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "8004:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  claude-config:
  shell-history:
  playwright-cache:
